<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Book</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.6);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 15px;
    }

    .container {
      background: #ffffff;
      max-width: 600px;
      width: 100%;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.2);
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: bold;
      color: #333;
    }

    label {
      font-weight: 600;
    }

    .btn-success {
      background-color: #28a745;
      border: none;
      transition: background 0.3s ease;
    }

    .btn-success:hover {
      background-color: #218838;
    }

    .btn-secondary {
      transition: background 0.3s ease;
    }

    .btn-secondary:hover {
      background-color: #6c757d;
    }
  </style>
</head>
<body>

<div class="overlay">
  <div class="container">
    <h2>Edit Book</h2>
    <form method="POST">
      <div class="mb-3">
        <label for="title" class="form-label"> Title</label>
        <input type="text" class="form-control" id="title" name="title" value="{{ book.title }}" required>
      </div>

      <div class="mb-3">
        <label for="author" class="form-label"> Author</label>
        <input type="text" class="form-control" id="author" name="author" value="{{ book.author }}" required>
      </div>

      <div class="mb-3">
        <label for="category" class="form-label"> Category</label>
        <input type="text" class="form-control" id="category" name="category" value="{{ book.category }}">
      </div>

      <div class="mb-3">
        <label for="total_copies" class="form-label"> Total Copies</label>
        <input type="number" class="form-control" id="total_copies" name="total_copies" value="{{ book.total_copies }}" min="1" required>
      </div>

      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-success"> Update Book</button>
        <a href="{{ url_for('books') }}" class="btn btn-secondary"> Cancel</a>
      </div>
    </form>
  </div>
</div>

</body>
</html>
