<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Members</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body style="background-image: url('{{ url_for('static', filename='bg/members.jpg') }}'); background-size: cover; background-position: center;">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('dashboard') }}">Library System</a>
      <div class="d-flex">
        <a href="{{ url_for('add_member') }}" class="btn btn-success me-2"> Add Member</a>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-light">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container text-white py-5">
    <h2 class="mb-4">👥 Manage Members</h2>

    <!-- Search Form -->
    <form method="GET" class="mb-4">
      <div class="input-group">
        <input type="text" name="search" class="form-control" placeholder="Search by name or email..." value="{{ search }}">
        <button class="btn btn-light" type="submit">Search</button>
      </div>
    </form>

    <!-- Members Table -->
    <div class="table-responsive bg-dark bg-opacity-75 rounded p-3">
      <table class="table table-bordered table-hover table-dark">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for member in members %}
          <tr>
            <td>{{ member.name }}</td>
            <td>{{ member.email }}</td>
            <td>{{ member.phone }}</td>
            <td>
              <a href="{{ url_for('edit_member', member_id=member.id) }}" class="btn btn-primary btn-sm"> Edit</a>
              <a href="{{ url_for('delete_member', member_id=member.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this member?');">🗑️ Delete</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
