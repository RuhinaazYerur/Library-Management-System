<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Member</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to right, #8e44ad, #3498db);
      color: white;
      min-height: 100vh;
    }

    .form-container {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 30px;
      border-radius: 12px;
      margin-top: 50px;
    }

    .navbar-brand {
      font-weight: bold;
    }

    h2 {
      font-weight: bold;
      text-shadow: 1px 1px 3px #000;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('dashboard') }}">Library System</a>
      <a href="{{ url_for('members') }}" class="btn btn-outline-light">← Back to Members</a>
    </div>
  </nav>

  <!-- Edit Member Form -->
  <div class="container">
    <div class="form-container mx-auto col-md-6">
      <h2 class="mb-4"> Edit Member Details</h2>
      <form method="POST" action="{{ url_for('edit_member', member_id=member.id) }}">
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" name="name" value="{{ member.name }}" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" name="email" value="{{ member.email }}" required>
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="text" class="form-control" id="phone" name="phone" value="{{ member.phone }}" required>
        </div>
        <button type="submit" class="btn btn-warning w-100"> Update Member</button>
      </form>
    </div>
  </div>

</body>
</html>
