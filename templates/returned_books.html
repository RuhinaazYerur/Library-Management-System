<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Returned Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h2 class="mb-4">Returned Books - {{ member_name }}</h2>
        <a href="{{ url_for('member_dashboard') }}" class="btn btn-secondary mb-3">Back to Dashboard</a>

        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Book Title</th>
                    <th>Author</th>
                    <th>Return Date</th>
                </tr>
            </thead>
            <tbody>
                {% if returned_books %}
                    {% for book in returned_books %}
                    <tr>
                        <td>{{ book[0] }}</td>
                        <td>{{ book[1] }}</td>
                        <td>{{ book[2] }}</td>
                    </tr>
                    {% endfor %}
                {% else %}
                    <tr><td colspan="3">No books returned yet.</td></tr>
                {% endif %}
            </tbody>
        </table>
    </div>
</body>
</html>
