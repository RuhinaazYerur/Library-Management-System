<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Embedded Custom CSS -->
  <style>
    body {
      background: linear-gradient(135deg, #1abc9c, #2c3e50);
      font-family: 'Poppins', sans-serif;
    }

    .login-box {
      background-color: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .login-box:hover {
      transform: scale(1.02);
    }

    h3 {
      font-weight: 600;
      color: #2c3e50;
    }

    .form-label {
      font-weight: 500;
      color: #34495e;
    }

    .form-control {
      border-radius: 10px;
    }

    .btn-primary {
      background-color: #1abc9c;
      border: none;
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: #16a085;
    }

    .alert {
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <form method="POST" action="{{ url_for('login') }}" class="login-box w-100" style="max-width: 420px;">
      <h3 class="text-center mb-4">Library Admin Login</h3>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-danger text-center">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="admin@library.com" required>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="********" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
    </form>
  </div>

</body>
</html>
