<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Issue Book</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body style="background-image: url('{{ url_for('static', filename='bg/issue.jpg') }}'); background-size: cover; background-position: center;">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('dashboard') }}">Library System</a>
      <div class="d-flex">
        <a href="{{ url_for('issued_books') }}" class="btn btn-outline-light"> View Issued Books</a>
      </div>
    </div>
  </nav>

  <!-- Issue Form -->
  <div class="container py-5 text-white">
    <div class="bg-dark bg-opacity-75 p-4 rounded shadow" style="max-width: 600px; margin: auto;">
      <h3 class="mb-4 text-center"> Issue Book</h3>
      <form method="POST">
        <div class="mb-3">
          <label for="member_id" class="form-label">Select Member</label>
          <select class="form-select" name="member_id" required>
            <option value="" disabled selected>-- Choose Member --</option>
            {% for member in members %}
              <option value="{{ member.id }}">{{ member.name }} ({{ member.email }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label for="book_id" class="form-label">Select Book</label>
          <select class="form-select" name="book_id" required>
            <option value="" disabled selected>-- Choose Book --</option>
            {% for book in books %}
              {% if book.available %}
                <option value="{{ book.id }}">{{ book.title }} by {{ book.author }}</option>
              {% endif %}
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label for="issue_date" class="form-label">Issue Date</label>
          <input type="date" name="issue_date" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="return_date" class="form-label">Return Date</label>
          <input type="date" name="return_date" class="form-control" required>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Issue Book</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
