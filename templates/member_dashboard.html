<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Member Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #dbeafe, #e0f2fe);
            min-height: 100vh;
            padding: 50px 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            max-width: 950px;
            margin: auto;
            animation: fadeIn 0.8s ease-in-out;
        }

        h2 {
            font-weight: bold;
            color: #2c3e50;
        }

        h4 {
            margin-top: 30px;
            color: #34495e;
        }

        .btn-danger {
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .btn-danger:hover {
            background-color: #c0392b;
            transform: scale(1.05);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background-color: #0d6efd;
            color: white;
            text-align: center;
            padding: 12px;
        }

        td {
            text-align: center;
            vertical-align: middle;
            padding: 10px;
        }

        tr:nth-child(even) {
            background-color: #f3f9ff;
        }

        tr:hover {
            background-color: #e6f0ff;
            transition: 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        .welcome-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .welcome-bar h2 i {
            margin-right: 10px;
            color: #0d6efd;
        }

        @media (max-width: 576px) {
            .welcome-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .btn-danger {
                margin-top: 15px;
            }

            table th, table td {
                font-size: 0.85rem;
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="welcome-bar mb-3">
            <h2><i class="fas fa-user-graduate"></i>Welcome, {{ member_name }}</h2>
            <a href="{{ url_for('member_logout') }}" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>

        <h4><i class="fas fa-book-reader"></i> Books Issued to You</h4>
        <div class="table-container">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th> Title</th>
                        <th> Author</th>
                        <th> Issue Date</th>
                        <th> Due Date</th>
                    </tr>
                </thead>
                <tbody>
                    {% for book in issued_books %}
                    <tr>
                        <td>{{ book[0] }}</td>
                        <td>{{ book[1] }}</td>
                        <td>{{ book[2] }}</td>
                        <td>{{ book[3] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <footer>
            &copy; 2025 Library Management System | Crafted with 💙 for Readers
        </footer>
    </div>

</body>
</html>
