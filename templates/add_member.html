<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Member</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <style>
    body {
      background: linear-gradient(to right, #2c3e50, #3498db);
      color: white;
      min-height: 100vh;
    }

    .form-container {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 30px;
      border-radius: 10px;
    }

    h2 {
      font-weight: bold;
    }

    label {
      font-weight: 500;
    }

    .navbar-brand {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('dashboard') }}">Library System</a>
      <a href="{{ url_for('members') }}" class="btn btn-outline-light">👥 View Members</a>
    </div>
  </nav>

  <!-- Content -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="form-container">
          <h2 class="mb-4 text-center">Add New Member</h2>
          <form action="{{ url_for('add_member') }}" method="POST">
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" name="name" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" name="email" id="email" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="text" name="phone" id="phone" class="form-control" required>
            </div>

            <div class="mb-4">
              <label for="address" class="form-label">Address</label>
              <textarea name="address" id="address" class="form-control" rows="3" required></textarea>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-success">Add Member</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
