<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #2c3e50, #4ca1af);
      color: white;
      min-height: 100vh;
    }

    h1, h2, h3 {
      font-weight: 600;
    }

    .navbar-brand {
      font-size: 1.5rem;
    }

    .btn-lg {
      padding: 15px 20px;
      font-size: 1.2rem;
      transition: transform 0.2s, box-shadow 0.3s;
      border-radius: 12px;
    }

    .btn-outline-primary {
      color: #fff;
      border-color: #3498db;
      background-color: rgba(52, 152, 219, 0.1);
    }

    .btn-outline-primary:hover {
      background-color: #3498db;
      color: white;
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(52, 152, 219, 0.7);
    }

    .container .row > div {
      display: flex;
      justify-content: center;
    }

    .dashboard-card {
      width: 100%;
      max-width: 280px;
      margin: 10px 0;
    }

    .lead {
      font-size: 1.25rem;
    }

    @media (max-width: 768px) {
      .btn-lg {
        font-size: 1rem;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"> Library System</a>
      <div class="d-flex">
        <a href="{{ url_for('logout') }}" class="btn btn-outline-light">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container text-center py-5">
    <h1 class="mb-3">Welcome, Admin </h1>
    <p class="lead mb-5">What would you like to manage today?</p>

    <div class="row justify-content-center g-4">
      <div class="col-md-4 dashboard-card">
        <a href="{{ url_for('books') }}" class="btn btn-outline-primary btn-lg w-100 shadow"> Manage Books</a>
      </div>
      <div class="col-md-4 dashboard-card">
        <a href="{{ url_for('members') }}" class="btn btn-outline-primary btn-lg w-100 shadow"> Manage Members</a>
      </div>
      <div class="col-md-4 dashboard-card">
        <a href="{{ url_for('issue_book') }}" class="btn btn-outline-primary btn-lg w-100 shadow"> Issue Books</a>
      </div>
      <div class="col-md-4 dashboard-card">
        <a href="{{ url_for('reports') }}" class="btn btn-outline-primary btn-lg w-100 shadow"> Reports</a>
      </div>
    </div>
  </div>

</body>
</html>
