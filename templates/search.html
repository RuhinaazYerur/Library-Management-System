<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <style>
    body {
      background: linear-gradient(to right, #f39c12, #d35400);
      color: white;
      min-height: 100vh;
    }

    .search-form {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 30px;
      border-radius: 10px;
    }

    h2 {
      font-weight: bold;
    }

    .navbar-brand {
      font-weight: bold;
    }

    .result-box {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('dashboard') }}">Library System</a>
      <a href="{{ url_for('add_book') }}" class="btn btn-outline-light"> Add Book</a>
    </div>
  </nav>

  <!-- Search Content -->
  <div class="container py-5">
    <h2 class="mb-4">🔍 Search Library</h2>

    <div class="search-form">
      <form method="POST" action="{{ url_for('search_results') }}">
        <div class="mb-3">
          <label for="query" class="form-label">Search by Book Title or Member Name</label>
          <input type="text" class="form-control" id="query" name="query" placeholder="Enter search keyword..." required>
        </div>
        <button type="submit" class="btn btn-warning w-100">Search</button>
      </form>
    </div>

    {% if results %}
    <div class="mt-5 result-box">
      <h4>🔎 Search Results:</h4>
      <ul class="list-group list-group-flush">
        {% for item in results %}
          <li class="list-group-item bg-transparent text-white">
            {{ item }}
          </li>
        {% endfor %}
      </ul>
    </div>
    {% elif searched %}
      <p class="mt-4 text-warning">No matching records found.</p>
    {% endif %}
  </div>

</body>
</html>
